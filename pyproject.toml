[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-telegram-scraper"
version = "0.2.0"
description = "Event-driven Telegram intelligence pipeline with explainable AI filtering"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Nikita Gorokhov" }]
dependencies = [
    "aiohttp>=3.14.1,<4",
    "aiosqlite>=0.22,<1",
    "chromadb==0.6.3",
    "fastapi>=0.128,<1",
    # Serves the corpus to OpenClaw agents over MCP stdio (eidolon_mcp.py).
    "mcp>=1.2,<2",
    "openai>=2.24,<3",
    # Chroma 0.6.3 still uses PostHog's pre-6 positional capture API.
    "posthog>=5.4,<6",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "pyyaml>=6,<7",
    "telethon==1.42.0",
    "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
eidolon-scraper = "main:main"
eidolon-auth = "auth:main"
eidolon-chats = "list_chats:main"
eidolon-eval = "evals.runner:main"
eidolon-calibrate = "evals.calibrate:main"

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "httpx2>=2,<3",
    "mypy>=1.19,<2",
    "pip-audit>=2.10,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "pytest-mock>=3.15,<4",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.14,<1",
    "types-pyyaml>=6.0.12,<7",
]

[tool.setuptools]
py-modules = ["main", "auth", "list_chats", "api"]

[tool.setuptools.packages.find]
include = ["config*", "evals*", "pipeline*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --timeout=15"
asyncio_mode = "auto"
filterwarnings = [
    # Chroma 0.6.3 is intentionally held below the unpatched 1.x advisory.
    "ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning:chromadb.types",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
files = [
    "api.py",
    "auth.py",
    "eidolon_mcp.py",
    "index_cli.py",
    "config",
    "evals",
    "list_chats.py",
    "main.py",
    "pipeline",
    "storage",
]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "tmp"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["config", "evals", "pipeline", "storage"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
