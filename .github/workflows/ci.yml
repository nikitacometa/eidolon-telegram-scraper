name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  UV_NO_SYSTEM_CONFIG: "1"

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Validate deployment scripts
        run: bash -n deploy/*.sh

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Open-taxonomy retrieval gate
        run: >-
          uv run eidolon-place-eval
          --dataset evals/data/place-retrieval-golden-v1.jsonl
          --fixture evals/data/place-retrieval-fixture-v1.db
          --query-vectors evals/data/place-query-vectors-v1.npz
          --k 5
          --fail-on-regression docs/place-retrieval-baseline-v1.json

      - name: Test with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Static security scan
        run: uv run bandit -r . -c pyproject.toml

      - name: Dependency vulnerability scan
        # The ignored advisories are all in ChromaDB's client-server mode
        # (RBAC/authorization providers and the HTTP API surface); this
        # project runs the embedded PersistentClient with no server, and no
        # fixed release exists for any of them.
        run: >-
          uv run pip-audit --local --skip-editable
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45831
          --ignore-vuln CVE-2026-45833
          --ignore-vuln PYSEC-2026-311

  container:
    name: Container build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag eidolon-telegram-scraper:ci .
